server {
    # Puerto fijo 80: debe coincidir con el puerto del dominio en Railway
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (login, dashboard, etc.): siempre devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash: cache largo
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
